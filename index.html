<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ee">
  <meta name="description" content="Planera smörrebröd till ditt event. Fördela, justera och kopiera din beställning.">
  <title>Matrosen, mitt event</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23233650'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Georgia' font-size='46' fill='%23f5f4ee'%3EM%3C/text%3E%3C/svg%3E">
  <style>
    @font-face{font-family:'Bodoni Moda';font-style:normal;font-weight:500;font-display:swap;src:url('https://fonts.gstatic.com/s/bodonimoda/v28/aFT67PxzY382XsXX63LUYL6GYFcan6NJrKp-VPjfJMShrpsGFUt8oXzawIA.ttf') format('truetype')}
    @font-face{font-family:Figtree;font-style:normal;font-weight:400;font-display:swap;src:url('https://fonts.gstatic.com/s/figtree/v9/_Xmz-HUzqDCFdgfMsYiV_F7wfS-Bs_d_QF5e.ttf') format('truetype')}
    @font-face{font-family:Figtree;font-style:normal;font-weight:600;font-display:swap;src:url('https://fonts.gstatic.com/s/figtree/v9/_Xmz-HUzqDCFdgfMsYiV_F7wfS-Bs_ehR15e.ttf') format('truetype')}
    :root{
      color-scheme:light;
      --paper:oklch(96.5% .012 90);--surface:oklch(99% .006 90);
      --ink:oklch(32% .055 258);--muted:oklch(49% .025 258);
      --line:oklch(85% .017 258);--soft:oklch(93% .012 258);
      --green:oklch(39% .07 151);--green-soft:oklch(94% .026 151);
      --amber:oklch(43% .095 55);--amber-soft:oklch(95% .031 75);
      --space-xs:4px;--space-sm:8px;--space-md:12px;--space-lg:16px;
      --space-xl:24px;--space-2xl:32px;--space-3xl:48px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Figtree,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
    button,input,textarea{font:inherit;color:inherit}
    button,a,input,summary,textarea{-webkit-tap-highlight-color:transparent}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.48}
    a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
    a:hover{text-decoration-thickness:2px}
    :focus-visible{outline:3px solid oklch(54% .15 260);outline-offset:4px}
    .shell{max-width:1000px;margin:auto;padding:40px 40px 32px}
    .masthead{display:flex;align-items:center;justify-content:space-between;gap:var(--space-xl);padding-bottom:var(--space-xl);border-bottom:1px solid var(--ink)}
    .brand{display:flex;align-items:center;gap:var(--space-lg)}
    .brand-mark{width:46px;height:46px;flex:none}
    h1{font-family:'Bodoni Moda',serif;font-size:42px;font-weight:500;line-height:1.12;letter-spacing:-1.5px;margin:0}
    .subtitle{font-size:14px;color:var(--muted);margin:4px 0 0}
    .event-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;min-height:44px;white-space:nowrap}
    .eyebrow{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
    .planner{padding:var(--space-xl) 0 var(--space-2xl)}
    .planner-fields{display:flex;align-items:flex-end;gap:var(--space-xl);flex-wrap:wrap}
    .field{display:flex;flex-direction:column;gap:var(--space-sm)}
    .field label{font-size:14px;font-weight:600}
    input[type=number]{appearance:textfield;-moz-appearance:textfield;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-variant-numeric:tabular-nums}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    .plan-input{width:84px;height:46px;padding:8px 12px;font-size:20px;font-weight:600}
    input:hover:not(:disabled){border-color:var(--muted)}
    input:focus{border-color:var(--ink)}
    input[aria-invalid=true]{border-color:var(--amber);background:var(--amber-soft)}
    .portion-line{display:flex;align-items:center;gap:var(--space-md)}
    .actual{font-size:13px;color:var(--muted);line-height:1.3;min-width:82px}
    .actual strong{font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;display:block;margin-bottom:2px}
    .primary,.secondary,.text-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:5px;padding:10px 16px;font-size:14px;font-weight:600;transition:background-color .15s,color .15s}
    .primary{background:var(--ink);color:var(--surface);border:1px solid var(--ink);height:46px}
    .primary:hover:not(:disabled){background:oklch(41% .075 258)}
    .secondary{background:transparent;border:1px solid var(--line)}
    .secondary:hover:not(:disabled){background:var(--soft);border-color:var(--muted)}
    .text-button{background:transparent;border:0;padding:8px;min-height:40px}
    .text-button:hover:not(:disabled){background:var(--soft)}
    .target-note{margin:12px 0 0;font-size:13px;color:var(--muted)}
    .target-note strong{color:var(--ink);font-weight:600}
    .error{color:var(--amber);font-size:13px;margin:8px 0 0}
    .order-heading{display:flex;align-items:center;justify-content:space-between;gap:var(--space-lg);padding-bottom:var(--space-lg)}
    .heading-line{display:flex;align-items:baseline;gap:var(--space-md);flex-wrap:wrap}
    h2{font-size:20px;letter-spacing:-.3px;font-weight:600;margin:0}
    .sort-count{font-size:13px;color:var(--muted)}
    .order-actions{display:flex;gap:var(--space-sm);align-items:center}
    .table-wrap{border:1px solid var(--line);border-radius:6px;background:var(--surface)}
    table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-variant-numeric:tabular-nums}
    col.include-col{width:64px}col.qty-col{width:112px}col.veg-col{width:108px}
    th,td{text-align:left}
    thead th{background:var(--soft);border-bottom:1px solid var(--line);padding:12px 16px;font-size:12px;font-weight:600;color:var(--muted)}
    thead th:first-child{border-top-left-radius:5px;padding:12px 0;text-align:center}
    thead th:last-child{border-top-right-radius:5px}
    .numeric{text-align:right}
    thead .numeric{padding-right:24px}
    tbody td,tbody th{border-bottom:1px solid var(--line);padding:9px 16px;height:59px}
    tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
    tbody th{font-weight:400;padding-left:0}
    tbody td:first-child{padding:0}
    tbody tr:hover{background:oklch(97.5% .009 258)}
    .toggle-label{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:52px;cursor:pointer}
    input[type=checkbox]{accent-color:var(--ink);width:19px;height:19px;cursor:pointer;margin:0}
    .dish-title{display:flex;align-items:center;gap:var(--space-sm);flex-wrap:wrap;font-size:15px;font-weight:600;line-height:1.25}
    .dish-description{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}
    .dish-trigger{display:block;width:100%;min-height:40px;text-align:left;border:0;background:transparent;padding:2px 0;border-radius:3px}
    .dish-trigger:hover .dish-name,.dish-trigger[aria-expanded=true] .dish-name{text-decoration:underline;text-underline-offset:3px}
    .preview-indicator{display:inline-flex;color:var(--muted)}
    .preview-indicator .icon{width:13px;height:13px}
    .dish-preview{position:fixed;z-index:20;width:340px;max-width:calc(100vw - 32px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 32px oklch(25% .04 258 / .15);font-weight:400}
    .preview-photo{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:var(--paper)}
    .preview-empty{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;aspect-ratio:16/9;background:var(--soft);color:var(--muted);font-size:14px}
    .preview-caption{padding:12px 16px 14px}
    .preview-caption h3{font-size:18px;line-height:1.35;font-weight:600;margin:0 0 4px}
    .preview-caption p{font-size:12px;color:var(--muted);line-height:1.45;margin:0 0 8px}
    .preview-caption a{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);min-height:24px}
    .preview-caption a .icon{width:12px;height:12px}
    .preview-close{position:absolute;right:8px;top:8px;display:flex;align-items:center;justify-content:center;width:36px;height:36px;background:var(--surface);border:1px solid var(--line);border-radius:50%;padding:0}
    .preview-close:hover{background:var(--soft)}
    .vego-tag{color:var(--green);background:var(--green-soft);font-size:10px;font-weight:600;letter-spacing:.25px;display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:3px;white-space:nowrap}
    .vego-tag svg{width:11px;height:11px}
    .qty-cell{text-align:right}
    .qty-input{width:70px;min-height:38px;padding:6px 10px;text-align:right;font-size:16px}
    .qty-input:disabled{background:transparent;border-color:transparent;color:var(--muted)}
    .veg-number{color:var(--green);font-weight:600;padding-right:24px}
    .no-veg{color:var(--muted);font-weight:400}
    .excluded .dish-title{color:var(--muted);font-weight:400}
    .excluded .dish-description{color:var(--muted)}
    .excluded{background:oklch(96% .007 258)}
    .excluded .vego-tag{background:var(--soft);color:var(--muted)}
    tfoot th,tfoot td{position:sticky;bottom:0;background:var(--ink);color:var(--surface);border-top:1px solid var(--ink);padding:14px 16px;z-index:1}
    tfoot th{font-size:15px;border-bottom-left-radius:5px;padding-left:22px}
    tfoot td{font-size:24px;font-weight:600;line-height:1.15;padding-right:24px}
    tfoot td:last-child{border-bottom-right-radius:5px;color:oklch(88% .07 151)}
    .total-sub{display:block;font-size:11px;font-weight:400;margin-top:3px;opacity:.85}
    .balance{display:flex;align-items:center;justify-content:space-between;gap:var(--space-lg);padding:12px 2px;font-size:13px;flex-wrap:wrap}
    .balance-label{display:flex;align-items:center;gap:7px}
    .balanced{color:var(--green)}.unbalanced{color:var(--amber)}
    .saved{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
    .notice{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--soft);padding:10px 14px;border-radius:4px;margin:0 0 12px}
    .notice:empty{display:none}
    .menu-note{font-size:12px;color:var(--muted);max-width:72ch;margin:14px 0 0;line-height:1.6}
    .menu-note strong{font-weight:600;color:var(--green)}
    .footer{display:flex;justify-content:space-between;gap:var(--space-lg);padding-top:var(--space-xl);margin-top:var(--space-xl);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
    .footer a{min-height:28px;display:inline-flex;align-items:center;gap:5px}
    .copy-fallback{margin-top:var(--space-lg)}
    .copy-fallback label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}
    textarea{width:100%;min-height:220px;padding:16px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:14px}
    .icon{width:16px;height:16px;flex:none}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .loading{padding:48px 24px;text-align:center;color:var(--muted)}
    .loading h1{color:var(--ink);margin-bottom:16px}
    @media(min-width:760px){.planner-fields{gap:32px}.planner .primary{margin-left:auto}}
    @media(max-width:640px){
      .shell{padding:24px 16px}.masthead{gap:12px;padding-bottom:20px}.brand{gap:10px}.brand-mark{width:34px;height:34px}
      h1{font-size:34px}.subtitle{font-size:12px}.event-link{font-size:12px}
      .planner{padding:20px 0 24px}.planner-fields{column-gap:24px;row-gap:16px}.planner .primary{width:100%}
      .order-heading{align-items:flex-start;gap:8px}.heading-line{display:block}.sort-count{display:block;margin-top:4px}
      .order-actions{gap:0}.secondary{padding:9px 10px}.text-button{padding:8px}.undo-label{display:none}
      h2{font-size:18px}col.include-col{width:40px}col.qty-col{width:76px}col.veg-col{width:64px}
      thead th{padding:10px 8px;font-size:11px}thead .numeric{padding-right:10px}
      tbody td,tbody th{padding:10px 8px;height:64px}.toggle-label{min-width:40px;min-height:54px}
      .dish-title{font-size:13px;gap:4px}.dish-description{font-size:11px}.vego-tag{font-size:9px;padding:2px 4px}
      .qty-input{width:58px;min-height:42px;padding:7px}.veg-number{padding-right:12px;font-size:14px}
      tfoot th{padding-left:12px;font-size:13px}tfoot td{padding-left:8px;padding-right:12px;font-size:21px}
      tfoot .total-sub{font-size:10px;white-space:nowrap}
      .balance{gap:8px}.footer{gap:12px;flex-wrap:wrap}.menu-note{font-size:12px}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
    @media print{
      body{background:white}.shell{padding:0;max-width:none}.planner,.order-actions,.event-link,.saved,.footer,.notice,.copy-fallback,.dish-preview,.preview-indicator{display:none!important}
      .masthead{margin-bottom:24px}.excluded{display:none}tfoot th,tfoot td{position:static;background:var(--soft);color:var(--ink)}
      tfoot td:last-child{color:var(--green)}.qty-input{border:0!important;background:transparent!important}.table-wrap{break-inside:avoid}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/scittle@0.8.33/dist/scittle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/scittle@0.8.33/dist/scittle.replicant.js"></script>
</head>

  <script>
    window.setTimeout(function () {
      const status = document.getElementById('load-status');
      if (status) status.textContent = 'Sidan kunde inte starta. Kontrollera internetanslutningen och ladda om.';
    }, 15000);
    // Calva supplies the bridge. A different WebSocket port can be set with ?nrepl=1340.
    var SCITTLE_NREPL_WEBSOCKET_HOST = 'localhost';
    var SCITTLE_NREPL_WEBSOCKET_PORT = Number(new URLSearchParams(location.search).get('nrepl') || 1340);
    if (['localhost', '127.0.0.1', ''].includes(location.hostname)) {
      const replScript = document.createElement('script');
      replScript.src = 'https://cdn.jsdelivr.net/npm/scittle@0.8.33/dist/scittle.nrepl.js';
      document.head.appendChild(replScript);
    }
  </script>

(ns matrosen.model
  (:require [clojure.string :as str]))

;; Menu data and identity stay separate from the editable order.
(def menu-url "https://static.thatsup.website/37/71554/Matrosen_Meny_20250918.pdf?v=1762507306")
(def event-url "https://www.meetup.com/sthlm-clj/")
(def menu
  [{:id :avokado :name "Avokado" :description "Ägg · majonnäs" :vego? true}
   {:id :brie :name "Brie" :description "Marmelad · pumpafrön" :vego? true}
   {:id :kornblomst :name "Kornblomst" :description "Äggula · rödlök" :vego? true}
   {:id :sill :name "Sill från Christiansø" :description "Inlagd sill" :vego? false}
   {:id :gubbrora :name "Gubbröra" :description "Ansjovis" :vego? false}
   {:id :gravlax :name "Gravlax" :description "Senapssås" :vego? false}
   {:id :varmrokt-lax :name "Varmrökt lax" :description "Ägg · majonnäs · gräslök" :vego? false}
   {:id :skagen :name "Skagenröra" :description "Handskalade räkor" :vego? false}
   {:id :rodspatta :name "Friterad rödspätta" :description "Remoulad" :vego? false}
   {:id :rostbiff :name "Marinerad rostbiff" :description "Remoulad · pepparrot · gurka · rostad lök" :vego? false}
   {:id :leverpastej :name "Dansk leverpastej" :description "Champinjoner · bacon" :vego? false}
   {:id :currykyckling :name "Currykyckling" :description "Selleri · bacon · rödlök" :vego? false}
   {:id :gamle-ole :name "Gamle Ole" :description "Skygelé · mörk rom" :vego? false}
   {:id :lun-postej :name "Lun postej" :description "Varm pastej" :vego? false :initially-off? true}])
(def menu-by-id (into {} (map (juxt :id identity) menu)))
(def storage-key "matrosen.order.v1")

;; Pure calculations: the target never overwrites the actual order on its own.
(defn number-value [value]
  (when-not (or (nil? value) (= "" value))
    (let [n (js/Number value)] (when (js/Number.isFinite n) n))))
(defn valid-number? [value minimum maximum integer?]
  (let [n (number-value value)]
    (and (some? n) (<= minimum n maximum) (or (not integer?) (js/Number.isInteger n)))))
(defn valid-settings? [order]
  (and (valid-number? (:guests order) 1 10000 true)
       (valid-number? (:per-person order) 0.5 100 false)))
(defn quantity [row] (if (valid-number? (:qty row) 0 1000000 true) (number-value (:qty row)) 0))
(defn valid-rows? [order]
  (every? (fn [[_ row]] (valid-number? (:qty row) 0 1000000 true)) (:rows order)))
(defn target [order]
  (when (valid-settings? order)
    (js/Math.ceil (- (* (number-value (:guests order)) (number-value (:per-person order))) 1e-9))))
(defn active-ids [order]
  (mapv :id (filter #(get-in order [:rows (:id %) :enabled?]) menu)))
(defn totals [order]
  (reduce (fn [result {:keys [id vego?]}]
            (let [row (get-in order [:rows id]) n (if (:enabled? row) (quantity row) 0)]
              (-> result (update :total + n) (update :vego + (if vego? n 0)))))
          {:total 0 :vego 0} menu))
(defn shares [n ids]
  (if (seq ids)
    (let [base (quot n (count ids)) extra (mod n (count ids))]
      (into {} (map-indexed (fn [i id] [id (+ base (if (< i extra) 1 0))]) ids)))
    {}))
(defn distribute [order]
  (let [ids (active-ids order) n (target order)]
    (if (and n (seq ids))
      (let [allocation (shares n ids)]
        (update order :rows
                (fn [rows] (into {} (map (fn [[id row]] [id (assoc row :qty (get allocation id 0))]) rows)))))
      order)))
(defn toggle-row [order id]
  (let [row (get-in order [:rows id])
        peers (filterv #(and (not= id %) (= (:vego? (menu-by-id id)) (:vego? (menu-by-id %))))
                       (active-ids order))
        n (quantity row)]
    (cond
      (not (:enabled? row)) {:order (assoc-in order [:rows id] {:enabled? true :qty 0})}
      (and (pos? n) (empty? peers)) {:error "Det här är sista aktiva sorten i kategorin. Sätt antalet till 0 eller aktivera en annan sort först."}
      :else {:order (reduce (fn [result [peer amount]]
                             (assoc-in result [:rows peer :qty] (+ (quantity (get-in result [:rows peer])) amount)))
                           (assoc-in order [:rows id] {:enabled? false :qty 0})
                           (shares n peers))})))
(defn default-order []
  (distribute {:guests 25 :per-person 3
               :rows (into {} (map (fn [{:keys [id initially-off?]}]
                                    [id {:enabled? (not initially-off?) :qty 0}]) menu))}))
(defn valid-stored-order? [order]
  (and (map? order) (valid-settings? order) (map? (:rows order))
       (= (set (keys (:rows order))) (set (map :id menu)))
       (every? (fn [[_ row]] (and (map? row) (boolean? (:enabled? row))
                                 (valid-number? (:qty row) 0 1000000 true)
                                 (or (:enabled? row) (zero? (quantity row))))) (:rows order))))

(defn format-number [n]
  (.toLocaleString n "sv-SE" #js {:maximumFractionDigits 2}))
(defn order-text [value]
  (let [{:keys [total vego]} (totals value)]
    (str/join "\n"
      (concat ["Matrosen, mitt event" ""]
              (keep (fn [{:keys [id name vego?]}]
                      (let [row (get-in value [:rows id]) n (quantity row)]
                        (when (and (:enabled? row) (pos? n))
                          (str n " × " name (when vego? " (vego*)"))))) menu)
              ["" (str "Totalt: " total " smörrebröd, varav " vego " vego*.")
               (str "Antal gäster: " (format-number (number-value (:guests value))))
               (str "Smörrebröd per person: " (format-number (/ total (number-value (:guests value)))))
               "" "*Vego enligt menybeskrivningarna, inklusive ägg och mjölk. Bekräfta med Matrosen."]))))

(ns matrosen.views
  (:require [matrosen.photos :as photos]
            [matrosen.model :refer [menu menu-by-id menu-url event-url number-value valid-number? valid-settings?
                                   valid-rows? quantity totals target active-ids format-number]]))

;; Presentation reads the same calculations used by the order actions.
(defn icon [kind]
  [:svg.icon {:viewBox "0 0 24 24" :fill "none" :stroke "currentColor" :stroke-width 1.7
              :stroke-linecap "round" :stroke-linejoin "round" :aria-hidden true}
   (case kind
     :arrow [:path {:d "M7 17 17 7M7 7h10v10"}]
     :close [:path {:d "m6 6 12 12M6 18 18 6"}]
     :photo [:g [:rect {:x 3 :y 4 :width 18 :height 16 :rx 2}] [:circle {:cx 8 :cy 9 :r 1.5}] [:path {:d "m3 17 5-5 4 4 4-6 5 7"}]]
     :copy [:g [:rect {:x 8 :y 8 :width 12 :height 13 :rx 2}] [:path {:d "M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"}]]
     :undo [:path {:d "m8 4-5 5 5 5M3 9h11a6 6 0 0 1 0 12h-3"}]
     :check [:path {:d "m5 12 4 4L19 6"}]
     :leaf [:g [:path {:d "M20 3C10 2 3 7 5 14c2 7 15 7 15-11Z"}] [:path {:d "m4 21 11-12"}]]
     :spread [:g [:path {:d "M4 6h16M4 12h16M4 18h16"}] [:path {:d "M8 4v4M16 10v4M11 16v4"}]]
     [:circle {:cx 12 :cy 12 :r 8}])])
(defn brand-mark []
  [:svg.brand-mark {:viewBox "0 0 48 48" :fill "none" :stroke "currentColor" :stroke-width 1.25 :aria-hidden true}
   [:circle {:cx 24 :cy 24 :r 21}]
   [:path {:d "M10 24c8-10 17-10 25 0-8 10-17 10-25 0Zm25 0 5-6v12l-5-6ZM24 17c-3 4-3 10 0 14"}]
   [:circle {:cx 17 :cy 23 :r 1 :fill "currentColor" :stroke "none"}]])
(defn dish-preview [{:keys [id position]}]
  (let [{:keys [name description]} (menu-by-id id) photo (get photos/photos id)]
    [:section#dish-preview.dish-preview
     {:role "dialog" :aria-modal false :aria-labelledby "preview-title" :style position
      :on {:pointerenter [[:preview/ax.keep]] :pointerleave [[:preview/ax.leave id]]}}
     [:button#preview-close.preview-close {:type "button" :aria-label "Stäng förhandsvisning"
                                          :on {:click [[:preview/ax.close true]]}} (icon :close)]
     (if photo
       [:img.preview-photo {:src (:src photo) :alt (str name " från Matrosen") :width 640 :height 360}]
       [:div.preview-empty (icon :photo) "Bild saknas"])
     [:div.preview-caption [:h3#preview-title name] [:p description]
      [:a {:href (or (:source photo) "https://matrosensmorrebrod.com/meny") :target "_blank" :rel "noreferrer"}
       (if photo (str "Foto: " (:credit photo)) "Se Matrosens meny") (icon :arrow)]]]))
(defn menu-row [value preview {:keys [id name description vego?]}]
  (let [row (get-in value [:rows id]) valid? (valid-number? (:qty row) 0 1000000 true)
        field-id (str "qty-" (cljs.core/name id))]
    [:tr {:replicant/key id :class (when-not (:enabled? row) "excluded")}
     [:td [:label.toggle-label
           [:input {:id (str "include-" (cljs.core/name id)) :type "checkbox" :checked (:enabled? row) :on {:change [[:order/ax.toggle id]]}
                    :aria-label (str "Ta med " name)}]]]
     [:th {:scope "row"}
      [:button.dish-trigger
       {:id (str "preview-" (cljs.core/name id)) :type "button" :aria-label (str "Visa " name)
        :aria-haspopup "dialog" :aria-expanded (= id (:id preview))
        :aria-controls (when (= id (:id preview)) "dish-preview")
        :on {:pointerenter [[:preview/ax.hover id :event/pointer-type :preview/anchor]]
             :pointerleave [[:preview/ax.leave id]]
             :focus [[:preview/ax.focus id :event/focus-visible? :preview/anchor]]
             :click [[:preview/ax.toggle id :preview/anchor :event/detail]]}}
       [:span.dish-title [:span.dish-name name] (when vego? [:span.vego-tag (icon :leaf) "Vego*"])
        [:span.preview-indicator (icon :photo)]]
       [:span.dish-description description]]]
     [:td.qty-cell
      [:input.qty-input {:id field-id :type "number" :inputmode "numeric" :min 0 :max 1000000 :step 1
                         :aria-label (str "Antal " name) :aria-invalid (not valid?)
                         :aria-describedby (when-not valid? "quantity-error")
                         :value (:qty row) :disabled (not (:enabled? row))
                         :on {:focus [[:ui/ax.select-input field-id]]
                              :input [[:order/ax.edit [:rows id :qty] :event/target.value]]}}]]
     [:td.numeric.veg-number {:class (when-not vego? "no-veg")}
      (if vego? (quantity row) [:span {:aria-label "0 vegetariska"} "–"])]]))
(defn app [{:keys [order history ui]}]
  (let [value order {:keys [total vego]} (totals value) desired (target value)
        guests (number-value (:guests value)) ids (active-ids value)
        settings-valid? (valid-settings? value) rows-valid? (valid-rows? value)
        actual (when (and guests (pos? guests)) (/ total guests))
        difference (when desired (- total desired))]
    [:main.shell
     [:header.masthead
      [:div.brand (brand-mark) [:div [:h1 "Matrosen"] [:p.subtitle "Mitt event · Smörrebrödsplaneraren"]]]
      [:a.event-link {:href event-url :target "_blank" :rel "noreferrer"} "sthlm.clj" (icon :arrow)]]
     [:section.planner {:aria-label "Planera antal"}
      [:div.planner-fields
       [:div.field [:label {:for "guests"} "Antal gäster"]
        [:input#guests.plan-input {:type "number" :inputmode "numeric" :min 1 :max 10000 :step 1
                                   :value (:guests value) :aria-invalid (not (valid-number? (:guests value) 1 10000 true))
                                   :aria-describedby (when-not settings-valid? "settings-error")
                                   :on {:focus [[:ui/ax.select-input "guests"]]
                                        :input [[:order/ax.edit [:guests] :event/target.value]]}}]]
       [:div.field [:label {:for "per-person"} "Smörrebröd per person"]
        [:div.portion-line
         [:input#per-person.plan-input {:type "number" :inputmode "decimal" :min 0.5 :max 100 :step "any"
                                        :value (:per-person value) :aria-invalid (not (valid-number? (:per-person value) 0.5 100 false))
                                        :aria-describedby (if settings-valid? "target-note" "settings-error")
                                        :on {:focus [[:ui/ax.select-input "per-person"]]
                                             :input [[:order/ax.edit [:per-person] :event/target.value]]}}]
         [:div.actual [:strong#actual-per-person (if (and actual rows-valid?) (format-number actual) "–")] "i beställningen"]]]
       [:button.primary {:disabled (or (not settings-valid?) (empty? ids))
                         :on {:click [[:order/ax.distribute]]}}
        (icon :spread) "Fördela jämnt"]]
      [:p#target-note.target-note
       (if desired (list "Mål: " [:strong (str (format-number desired) " smörrebröd")] ". ") "")
       "Fälten används när du fördelar. Du kan alltid justera raderna själv."]
      (when-not settings-valid? [:p#settings-error.error "Ange 1–10 000 hela gäster och 0,5–100 smörrebröd per person."])
      (when (empty? ids) [:p.error "Aktivera minst en sort för att fördela."])]
     [:section {:aria-labelledby "order-title"}
      [:div.order-heading
       [:div.heading-line [:h2#order-title "Din beställning"] [:span.sort-count (str (count ids) " av " (count menu) " sorter")]]
       [:div.order-actions
        [:button.text-button {:on {:click [[:order/ax.undo]]} :disabled (empty? history) :aria-label "Ångra senaste ändringen" :title "Ångra senaste ändringen"}
         (icon :undo) [:span.undo-label "Ångra"]]
        [:button.secondary {:on {:click [[:order/ax.copy]]} :disabled (or (not settings-valid?) (not rows-valid?) (zero? total))}
         (icon :copy) "Kopiera"]]]
      [:div.notice {:role "status" :aria-live "polite"} (:notice ui)]
      [:div.table-wrap
       [:table
        [:caption.sr-only "Smörrebröd: välj sorter, ändra antal och se hur många som är vegetariska."]
        [:colgroup [:col.include-col] [:col] [:col.qty-col] [:col.veg-col]]
        [:thead [:tr [:th {:scope "col"} "Med"] [:th {:scope "col"} "Smörrebröd"]
                 [:th.numeric {:scope "col"} "Antal"] [:th.numeric {:scope "col"} "Vego*"]]]
        [:tbody (for [dish menu] (menu-row value (:preview ui) dish))]
        [:tfoot [:tr [:th {:scope "row" :colspan 2} "Totalt" [:span.total-sub "smörrebröd"]]
                 [:td#total-count.numeric (if rows-valid? total "–")]
                 [:td#vego-count.numeric (if rows-valid? vego "–")
                  [:span.total-sub (if (and rows-valid? (pos? total)) (str (js/Math.round (* 100 (/ vego total))) " % vego") "vego")]]]]]]
      (when-not rows-valid? [:p#quantity-error.error "Ange ett helt antal från 0 i de markerade raderna. Summan visas när alla antal är giltiga."])
      [:div.balance
       [:span.balance-label {:class (if (and rows-valid? (= 0 difference)) "balanced" "unbalanced")}
        (cond
          (not rows-valid?) "Kontrollera de markerade antalen"
          (nil? desired) "Fyll i planeringen för att jämföra med målet"
          (zero? difference) (list (icon :check) "Beställningen matchar målet")
          (pos? difference) (str (format-number difference) " fler än målet på " (format-number desired))
          :else (str (format-number (- difference)) " färre än målet på " (format-number desired))) ]
       [:span.saved (:saved ui)]]
      (when-let [text (:copy-text ui)]
        [:div.copy-fallback [:label {:for "copy-text"} "Din beställning som text"]
         [:textarea#copy-text {:value text :readonly true :on {:focus [[:ui/ax.select-input "copy-text"]]}}]])
      [:p.menu-note [:strong "*Vego"] " enligt menybeskrivningarna, med ägg och mjölk. Bekräfta med Matrosen. Gamle Ole räknas inte som vego eftersom den serveras med skygelé."]]
     [:footer.footer
      [:a {:href menu-url :target "_blank" :rel "noreferrer"} "Menyunderlag · 18 sep 2025" (icon :arrow)]
      [:span "För din planering. Ingen beställning skickas."]]
     (when-let [preview (:preview ui)] (dish-preview preview))]))



(ns matrosen.db
  (:require [matrosen.model :as model]))

(defonce !state
  (atom {:order (model/default-order) :history [] :initialized? false
         :ui {:notice nil :saved "" :copy-text nil}}))

(ns matrosen.actions
  (:require [matrosen.model :as model]))

(defn save-recipe [order]
  (if (and (model/valid-settings? order) (model/valid-rows? order))
    {:uf/fxs [[:uf/await :storage/fx.save order]]
     :uf/dxs [[:storage/ax.saved :uf/prev-result]]}
    {}))

(defn change-order [db value message]
  (merge
    {:uf/db (-> db
                (cond-> (not= value (:order db))
                  (update :history #(vec (take-last 30 (conj % (:order db))))))
                (assoc :order value)
                (assoc-in [:ui :notice] message)
                (assoc-in [:ui :copy-text] nil)
                (assoc-in [:ui :saved]
                          (if (and (model/valid-settings? value) (model/valid-rows? value))
                            "Sparar…" "Ogiltiga värden sparas inte")))}
    (save-recipe value)))

(defn handle-action [db [action & args]]
  (case action
    :app/ax.initialize
    (if (:initialized? db)
      {:uf/db db}
      {:uf/fxs [[:uf/await :storage/fx.load]]
       :uf/dxs [[:storage/ax.loaded :uf/prev-result]]})

    :storage/ax.loaded
    (let [{:keys [success value]} (first args)
          valid? (and (= 1 (:version value)) (model/valid-stored-order? (:order value)))
          order (if valid? (:order value) (:order db))]
      (merge {:uf/db (-> db (assoc :order order :initialized? true)
                         (assoc-in [:ui :saved] (if success "Sparar…" "Lokalt sparande är inte tillgängligt"))
                         (assoc-in [:ui :notice]
                                   (when (and success (some? value) (not valid?))
                                     "Den sparade beställningen kunde inte läsas. Ett nytt förslag visas.")))}
             (when success (save-recipe order))))

    :storage/ax.saved
    {:uf/db (assoc-in db [:ui :saved]
                     (if (:success (first args)) "Sparat i den här webbläsaren" "Kunde inte spara i webbläsaren"))}

    :order/ax.edit
    (let [[path value] args] (change-order db (assoc-in (:order db) path value) nil))

    :order/ax.distribute
    (let [order (:order db)]
      (when (and (model/valid-settings? order) (seq (model/active-ids order)))
        (change-order db (model/distribute order) "Beställningen är jämnt fördelad på alla aktiva sorter.")))

    :order/ax.toggle
    (let [id (first args) order (:order db)]
      (if-not (model/valid-rows? order)
        {:uf/db (assoc-in db [:ui :notice] "Rätta antalet i de markerade raderna innan du ändrar vilka sorter som är med.")
         :uf/fxs [[:dom/fx.check-input (str "include-" (name id)) (get-in order [:rows id :enabled?])]]}
        (let [{next-order :order error :error} (model/toggle-row order id)
              was-active? (get-in order [:rows id :enabled?])
              n (model/quantity (get-in order [:rows id]))]
          (if error {:uf/db (assoc-in db [:ui :notice] error)
                     :uf/fxs [[:dom/fx.check-input (str "include-" (name id)) (get-in order [:rows id :enabled?])]]}
            (change-order db next-order
              (if was-active?
                (if (pos? n) (str n " smörrebröd fördelades på övriga "
                                 (if (:vego? (model/menu-by-id id)) "vegosorter." "icke-vegetariska sorter."))
                    "Sorten är avstängd.")
                "Sorten är aktiverad med 0. Ange ett antal eller välj Fördela jämnt."))))))

    :order/ax.undo
    (when-let [previous (peek (:history db))]
      (assoc-in (change-order db previous "Senaste ändringen ångrades.")
                [:uf/db :history] (pop (:history db))))

    :order/ax.copy
    (let [order (:order db)]
      (when (and (model/valid-settings? order) (model/valid-rows? order) (pos? (:total (model/totals order))))
        (let [text (model/order-text order)]
          {:uf/fxs [[:uf/await :clipboard/fx.write text]]
           :uf/dxs [[:clipboard/ax.copied text :uf/prev-result]]})))

    :clipboard/ax.copied
    (let [[text result] args]
      {:uf/db (-> db
                  (assoc-in [:ui :copy-text] (when-not (:success result) text))
                  (assoc-in [:ui :notice]
                            (if (:success result) "Beställningen är kopierad."
                                "Markera och kopiera beställningen i textfältet nedan.")))})

    :ui/ax.select-input
    {:uf/fxs [[:dom/fx.select-input (first args)]]}

    :ui/ax.effect-failed
    {:uf/db (assoc-in db [:ui :notice] "Åtgärden kunde inte slutföras. Dina antal finns kvar på sidan.")}

    :uf/unhandled-ax))

(ns matrosen.effects
  (:require [replicant.dom :as dom]
            [matrosen.model :as model]
            [matrosen.views :as views]))

(defn perform-effect! [[effect & args]]
  (case effect
    :dom/fx.render
    (dom/render (.getElementById js/document "app") (views/app (first args)))

    :dom/fx.select-input
    (when-let [element (.getElementById js/document (first args))] (.select element))

    :dom/fx.check-input
    (when-let [element (.getElementById js/document (first args))]
      (set! (.-checked element) (second args)))

    :storage/fx.load
    (try
      (let [raw (.getItem js/localStorage model/storage-key)]
        {:success true :value (when raw
                               (try (js->clj (js/JSON.parse raw) :keywordize-keys true)
                                    (catch :default _ :invalid)))})
      (catch :default _ {:success false}))

    :storage/fx.save
    (try (.setItem js/localStorage model/storage-key
                   (js/JSON.stringify (clj->js {:version 1 :order (first args)})))
         {:success true}
         (catch :default _ {:success false}))

    :clipboard/fx.write
    (if (and (.-clipboard js/navigator) (.-isSecureContext js/window))
      (try (-> (.writeText (.-clipboard js/navigator) (first args))
               (.then (fn [] {:success true}))
               (.catch (fn [_] {:success false})))
           (catch :default _ {:success false}))
      {:success false})

    :uf/unhandled-fx))

(ns matrosen.event-handler
  (:require [clojure.walk :as walk]
            [replicant.dom :as dom]
            [matrosen.db :as db]
            [matrosen.actions :as actions]
            [matrosen.effects :as effects]))

(defn enrich [state replicant-data action]
  (walk/postwalk
    (fn [value]
      (cond
        (= :event/target.value value) (some-> replicant-data :replicant/js-event .-target .-value)
        (and (vector? value) (= :db/get (first value))) (get state (second value))
        :else value))
    action))

(defn handle-actions [state replicant-data action-list]
  (reduce
    (fn [{:uf/keys [db] :as result} action]
      (let [next (actions/handle-action db (enrich db replicant-data action))]
        (when (= :uf/unhandled-ax next)
          (throw (ex-info "Unhandled action" {:action action})))
        (cond-> result
          (contains? next :uf/db) (assoc :uf/db (:uf/db next))
          (:uf/fxs next) (update :uf/fxs into (:uf/fxs next))
          (:uf/dxs next) (update :uf/dxs into (:uf/dxs next)))))
    {:uf/db state :uf/fxs [] :uf/dxs []}
    action-list))

(defn replace-result [form result]
  (walk/postwalk #(if (= :uf/prev-result %) result %) form))

(defn execute-effects! [fxs]
  (reduce
    (fn [promise raw-fx]
      (.then promise
        (fn [previous]
          (let [await? (= :uf/await (first raw-fx))
                fx (replace-result (if await? (vec (rest raw-fx)) raw-fx) previous)
                result (effects/perform-effect! fx)]
            (when (= :uf/unhandled-fx result)
              (throw (ex-info "Unhandled effect" {:effect fx})))
            (if await? result previous)))))
    (js/Promise.resolve nil) fxs))

;; The only runtime state read and write. Rendering receives the committed value.
(defn dispatch!
  ([action-list] (dispatch! action-list nil))
  ([action-list replicant-data]
   (let [before @db/!state
         {:uf/keys [db fxs dxs]} (handle-actions before replicant-data action-list)]
     (when (some? db)
       (reset! db/!state db)
       (effects/perform-effect! [:dom/fx.render db]))
     (if (seq fxs)
       (-> (execute-effects! fxs)
           (.then (fn [result]
                    (when (seq dxs) (dispatch! (replace-result dxs result)))))
           (.catch (fn [error]
                     (js/console.error "Uniflow effect failed" error)
                     (dispatch! [[:ui/ax.effect-failed]]))))
       (when (seq dxs) (dispatch! dxs))))))

(defn init! []
  (dom/set-dispatch! (fn [data action-list] (dispatch! action-list data)))
  (dispatch! [[:app/ax.initialize]]))

(init!)
  </script>
